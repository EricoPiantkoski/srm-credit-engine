name: Create release branch

on:
  push:
    branches: [develop]

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine next version
        id: version
        run: |
          latest=$(git tag -l 'v*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "next=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            next=$(echo "$latest" | sed 's/^v//' | awk -F. '{print "v"$1"."$2"."$3+1}')
            echo "next=$next" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release branch
        run: git push origin HEAD:refs/heads/release/${{ steps.version.outputs.next }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
