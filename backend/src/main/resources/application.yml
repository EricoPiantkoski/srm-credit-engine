server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
    max-http-request-header-size: 8KB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      issuer: ${JWT_ISSUER:SRM-CREDIT-ENGINE}
    rate-limit:
      capacity: ${RATE_LIMIT_CAPACITY:100}
      refill-period: ${RATE_LIMIT_REFILL:PT1M}
    expose-docs: ${SECURITY_EXPOSE_DOCS:false}
    content-security-policy: ${SECURITY_CONTENT_SECURITY_POLICY:default-src 'self'}
  precificacao:
    taxa-base: ${PRECIFICACAO_TAXA_BASE:0.0}
  cambio:
    bcb-ptax:
      base-url: ${BCB_PTAX_BASE_URL:https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata}
      timeout-ms: ${BCB_PTAX_TIMEOUT_MS:5000}
      quote-currency: ${BCB_PTAX_QUOTE_CURRENCY:USD}
    awesome-api:
      base-url: ${AWESOME_API_BASE_URL:https://economia.awesomeapi.com.br}
      timeout-ms: ${AWESOME_API_TIMEOUT_MS:5000}

spring:
  application:
    name: srm-credit-engine
  cloud:
    openfeign:
      client:
        config:
          bcbPtax:
            connect-timeout: ${app.cambio.bcb-ptax.timeout-ms}
            read-timeout: ${app.cambio.bcb-ptax.timeout-ms}
            retryer: com.srm.creditengine.cambio.infrastructure.config.BackoffRetryer
            error-decoder: com.srm.creditengine.cambio.infrastructure.config.RetryableServerErrorDecoder
          awesomeApiBrc:
            connect-timeout: ${app.cambio.awesome-api.timeout-ms}
            read-timeout: ${app.cambio.awesome-api.timeout-ms}
            retryer: com.srm.creditengine.cambio.infrastructure.config.BackoffRetryer
            error-decoder: com.srm.creditengine.cambio.infrastructure.config.RetryableServerErrorDecoder

management:
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  profiles-sample-rate: 0.1
