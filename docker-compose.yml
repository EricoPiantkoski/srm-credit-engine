services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: srm_credit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5656:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
