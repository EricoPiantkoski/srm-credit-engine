<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/srm_logo_2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRM Credit Engine</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('srm-theme') || 'system'
          var resolved = stored
          if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } else {
            document.documentElement.setAttribute('data-theme', stored)
          }
          var favicon = document.querySelector("link[rel~='icon']")
          if (favicon) {
            favicon.setAttribute('href', resolved === 'dark' ? '/srm_logo_2_darkmode.png' : '/srm_logo_2.png')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
